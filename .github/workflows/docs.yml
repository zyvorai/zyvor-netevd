name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Build Documentation
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","Linux","ARM64","fluxvm"]') }}
    # Needed to push the generated rustdoc HTML to gh-pages below — the repo's
    # default GITHUB_TOKEN permissions are read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          force_orphan: true

  spelling:
    name: Spell Check
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","Linux","ARM64","fluxvm"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Check spelling
        uses: crate-ci/typos@master
        with:
          files: |
            ./src
            ./README.md
            ./SECURITY.md
            ./config

  links:
    name: Link Check
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","Linux","ARM64","fluxvm"]') }}
    steps:
      - uses: actions/checkout@v7

      # lychee-action@v2 ends with "lychee: command not found" on the
      # self-hosted ARM64 runner, so install and call a pinned release.
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYCHEE_VERSION: v0.24.2
        run: |
          set -euo pipefail
          target="lychee-$(uname -m)-unknown-linux-gnu"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${target}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${target}/lychee" --verbose --no-progress --config lychee.toml '**/*.md' '**/*.rs'
