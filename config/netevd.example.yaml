# netevd configuration file
# SPDX-License-Identifier: LicenseRef-Zyvor-Production-2.0

system:
  log_level: "info"  # Options: trace, debug, info, warn, error
  backend: "systemd-networkd"  # Options: systemd-networkd, NetworkManager, dhclient

monitoring:
  interfaces:  # Exact names (empty = all, minus exclude)
    - eth0
    - eth1
  match_patterns:  # Globs; empty = no extra include filter
    - "eth*"
    - "enp*"
    - "wg*"
  exclude:  # Globs; empty + selector defaults skip lo/docker/cni/veth/cilium
    - "lo"
    - "docker*"
    - "veth*"
    - "cni*"
    - "cilium*"

hooks:
  debounce_ms: 50      # coalesce netlink bursts per (link, event)
  timeout_sec: 30      # per-script timeout
  max_parallel: 1      # reserved: scripts always run sequentially
  max_pending: 4096    # cap on distinct (link, event) keys waiting in the debouncer
  sandbox:             # see docs/hardening.md
    workdir: "/"
    pass_env: ["HOME", "USER", "LANG", "TZ"]
    max_env_bytes: 262144
    max_output_bytes: 65536
    umask: 18          # decimal; 18 = 0o022
    strict_script_perms: false  # true: refuse group/other-writable, setuid or foreign-owned scripts
    rlimit_nofile: 0   # 0 = leave unchanged (same for the other rlimit_* keys)
    rlimit_cpu_sec: 0
    rlimit_as_mb: 0
    rlimit_fsize_mb: 0
    no_core_dumps: true
  history_size: 1000   # dispatched events kept for /api/v1/events and the stream
  # journal_path: /var/lib/netevd/events.jsonl   # append every dispatched event (0600), explain --from-file replays it
  journal_max_bytes: 10485760   # rotate to <path>.1 beyond this (0 = never)
  startup_triggers: false       # fire link-added / address-added hooks for existing links at start
  rate_limit:          # per (link, event); burst 0 = off
    burst: 0
    per_minute: 30
    max_keys: 2048

routing:
  policy_rules:  # Interfaces for custom routing tables
    - eth1

backends:
  systemd_networkd:
    emit_json: true  # Emit JSON data to scripts

  dhclient:
    use_dns: false  # Send DNS to systemd-resolved
    use_domain: false  # Send domain to systemd-resolved
    use_hostname: false  # Send hostname to systemd-hostnamed

  networkmanager: {}

# API server configuration
api:
  enabled: true  # Enable REST API server
  bind_address: "127.0.0.1"  # Bind address (use 0.0.0.0 for all interfaces)
  port: 9090  # API server port
  tls:
    enabled: false  # Enable TLS/SSL
    cert_file: ""  # Path to TLS certificate
    key_file: ""   # Path to TLS private key

# Prometheus metrics configuration
metrics:
  enabled: true  # Enable Prometheus metrics endpoint
  port: 9091  # Metrics endpoint port

# Audit logging configuration
audit:
  enabled: false  # Enable audit logging
  path: "/var/log/netevd/audit.log"  # Audit log file path
  retention_days: 90  # Number of days to keep audit logs

# Event filters (execute or ignore events based on rules)
filters:
  # Example 1: Only execute scripts for VPN interfaces
  - match_rule:
      interface_pattern: "wg*"  # Match WireGuard interfaces
      event_type: "routable"
    action: execute
    scripts: []  # Empty means use default scripts for this event

  # Example 2: Ignore docker/virtual interfaces
  - match_rule:
      interface_pattern: "docker*"
    action: ignore

  # Example 3: Only execute for interfaces with gateway
  - match_rule:
      interface: "eth0"
      condition: "has_gateway"
    action: execute

  # Example 4: Log events for debugging
  - match_rule:
      backend: "NetworkManager"
      event_type: "activated"
    action: log

# Observe-only eBPF (off by default). Requires `cargo build --features ebpf`
# plus netevd-ebpf.o from `make -C ebpf`. Does not filter or rewrite packets.
ebpf:
  enabled: false
  drops: true
  tcp_retransmit: false
  tcp_reset: false
  debounce_ms: 250
  min_count: 8
  object_path: ""
  skip_unknown_ifindex: true
  reasons_allow: []       # e.g. ["QDISC_DROP", "NETFILTER_DROP"]
  reasons_deny: []        # e.g. ["NO_SOCKET"]
