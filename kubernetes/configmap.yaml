apiVersion: v1
kind: ConfigMap
metadata:
  name: netevd-config
  namespace: kube-system
  labels:
    app: netevd
data:
  netevd.yaml: |
    system:
      log_level: "info"
      backend: "systemd-networkd"

    monitoring:
      interfaces: []  # Monitor all interfaces (empty list)

    routing:
      policy_rules: []  # No custom routing rules

    backends:
      systemd_networkd:
        emit_json: true

      dhclient:
        use_dns: false
        use_domain: false
        use_hostname: false

      networkmanager: {}

    # Loopback only (the pod uses the host network). To let Prometheus or
    # other hosts reach the API, mount a token and certificate from a Secret,
    # set bind_address to "0.0.0.0" and enable the settings below; then change
    # the probes in deployment.yaml to match (see docs/hardening.md).
    api:
      enabled: true
      bind_address: "127.0.0.1"
      port: 9090
      # auth:
      #   token_file: /etc/netevd-api/token
      #   public_metrics: false
      # tls:
      #   enabled: true
      #   cert_file: /etc/netevd-api/tls.crt
      #   key_file: /etc/netevd-api/tls.key

    metrics:
      enabled: true

    audit:
      enabled: true
      path: "/var/log/netevd/audit.log"

    filters:
      - match_rule:
          interface_pattern: "eth*"
          event_type: "routable"
        action: execute
        scripts:
          - 01-k8s-notify.sh

      - match_rule:
          interface_pattern: "cni*"
        action: ignore

      - match_rule:
          interface_pattern: "docker*"
        action: ignore

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netevd-scripts
  namespace: kube-system
  labels:
    app: netevd
data:
  01-k8s-notify.sh: |
    #!/bin/bash
    # Kubernetes notification script

    echo "Network event on $LINK: $STATE"
    logger -t netevd-k8s "Interface $LINK is now $STATE with IP $ADDRESSES"

    # Could send to Kubernetes event API here
    # kubectl create event ...
